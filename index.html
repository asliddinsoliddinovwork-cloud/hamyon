<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EBEBEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hamyon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="format-detection" content="telephone=no">
<title>Hamyon</title>
<style>
:root{
  --bg:#EBEBEB; --card:#F4F4F4; --card2:#FAFAFA; --ink:#121212; --muted:#8C8C8C; --line:#E6E6E6;
  --green:#22C55E; --green-ink:#16A34A; --red:#E5484D; --amber:#D97706;
  --sh:0 1px 0 rgba(255,255,255,.9) inset, 0 6px 18px rgba(0,0,0,.045);
  --t2:#555; --t3:#666; --t4:#444; --t5:#333;
  --seg:#E0E0E0; --seg-on:#FFFFFF; --seg-on-ink:#000; --chip:#E4E4E4; --track:#E0E0E0; --donut-bg:#ECECEC;
  --sheet:#F2F2F2; --grab:#CFCFCF; --input:#FFFFFF; --input-line:#E1E1E1; --input-focus:#B5B5B5;
  --btn:#141414; --btn-ink:#FFFFFF; --tabbar:rgba(250,250,250,.92); --tab-on:#E6E6E6; --tab-on-ink:#000;
  --ring:#FFFFFF; --nag-bg:#FFF6E6; --nag-ink:#7A4B00; --warn-bg:#FFF4E5;
  --toast:#141414; --toast-ink:#FFFFFF; --toast-act:#7EE2A0; --bo:#1C1C1C; --foot:#AAA; --dim:rgba(0,0,0,.28);
}
:root[data-theme="dark"]{
  --bg:#0D0D0E; --card:#18181A; --card2:#1C1C1E; --ink:#F2F2F2; --muted:#8E8E93; --line:#2A2A2D;
  --green:#30D158; --green-ink:#34D86A; --red:#FF5A5F; --amber:#F5A524;
  --sh:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 18px rgba(0,0,0,.35);
  --t2:#A1A1A6; --t3:#9A9AA0; --t4:#C7C7CC; --t5:#D1D1D6;
  --seg:#2A2A2D; --seg-on:#48484C; --seg-on-ink:#FFF; --chip:#2C2C2E; --track:#2E2E31; --donut-bg:#2A2A2D;
  --sheet:#141416; --grab:#48484A; --input:#1F1F22; --input-line:#2E2E31; --input-focus:#5A5A5E;
  --btn:#F2F2F2; --btn-ink:#121212; --tabbar:rgba(30,30,32,.92); --tab-on:#3A3A3C; --tab-on-ink:#FFF;
  --ring:#2C2C2E; --nag-bg:#2B2210; --nag-ink:#F5C26B; --warn-bg:#2B2210;
  --toast:#F2F2F2; --toast-ink:#121212; --toast-act:#16A34A; --bo:#E5E5EA; --foot:#636366; --dim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;transition:background-color .3s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 120px)}

/* Header */
.hdr{display:flex;align-items:center;gap:10px;margin:6px 0 26px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(#d4d4d4,#b5b5b5);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px;box-shadow:0 0 0 3px var(--ring);flex:none}
.hello{flex:1;display:flex;flex-direction:column;min-width:0}
.hello small{color:var(--muted);font-size:13px}
.hello b{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;box-shadow:var(--sh);position:relative;flex:none}
.round.sm{width:34px;height:34px}
.round:disabled{opacity:.35}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#F97316;border:1.5px solid var(--card2)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 20px;min-height:44px}
.ph h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.ph.center h1{flex:1;text-align:center;font-size:18px}

/* Balance */
.acct{font-size:11px;letter-spacing:.02em;color:var(--t2);display:flex;align-items:center;gap:6px;text-transform:uppercase}
.gdot{width:7px;height:7px;border-radius:2px;background:var(--green)}
.bal-row{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.bal{font-size:38px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bal span{font-size:17px;color:#A3A3A3;font-weight:500;margin-left:6px;letter-spacing:0}
@media (max-width:360px){.bal{font-size:31px}}
.upd{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;flex-wrap:wrap}

.sec{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px;color:var(--t2);font-size:15px;gap:10px}
.link{font-weight:600;color:var(--ink);font-size:15px}

/* Accounts */
.accs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 8px;scroll-snap-type:x proximity}
.accs::-webkit-scrollbar{display:none}
.acc{flex:none;width:max-content;min-width:150px;max-width:250px;background:var(--card2);border-radius:18px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px;scroll-snap-align:start;transition:transform .15s}
.acc:active{transform:scale(.97)}
.acc-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.acc-top span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.acc b{font-size:16px;padding-right:2px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc.add{align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;box-shadow:none;background:transparent;border:1.5px dashed var(--track);width:110px}

/* Quick actions */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{background:var(--card2);border-radius:18px;padding:16px 14px 14px;min-height:118px;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .15s}
.qa-ic{margin-bottom:auto;padding-bottom:18px;display:block}
.qa b{font-weight:500;font-size:16px}
.qa small{color:var(--muted);font-size:12px;margin-top:4px}
.qa:active,.tx:active,.card[data-act]:active,.btn:active{transform:scale(.98)}

.card{display:block;width:100%;background:var(--card2);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.spent{margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.spent .row span{font-size:14px}
.spent .row b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.spent .row b small{color:var(--muted);font-weight:500;font-size:13px}
.bar{height:14px;margin:14px 0 8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--track) 0 3px,transparent 3px 6px);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.bar.warn i{background:#F59E0B}
.bar.over i{background:var(--red)}
.bar.sm{height:8px;margin:8px 0 0}
.bar.xs{height:4px;margin:6px 0 0;width:100%;display:block}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--t3)}
.pos{color:var(--green-ink)} .neg{color:var(--red)} .muted{color:var(--muted)}
.nag{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--nag-bg);color:var(--nag-ink);font-size:13px}
.nag span{flex:1}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.tx{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);transition:transform .15s}
.tx-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;background:var(--chip)}
.tx-ic.av{background:var(--chip);font-size:14px;font-weight:600;color:var(--t4)}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tx-t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s em{font-style:normal}
.tx-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;max-width:48%}
.tx-a{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dhead{display:flex;justify-content:space-between;font-size:13px;color:var(--t3);margin:18px 4px 8px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty span{font-size:34px;display:block}
.empty p{margin:8px 0 0}
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:14px;padding:0 12px;box-shadow:var(--sh);color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:12px 0;font-size:16px;outline:none;color:var(--ink);min-width:0}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--seg);border-radius:13px;padding:3px}
.seg button{padding:9px 6px;border-radius:10px;text-align:center;font-size:14px;color:var(--t2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--seg-on);color:var(--seg-on-ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Stats */
.mswitch{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.mswitch b{min-width:140px;text-align:center;font-size:16px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi b{font-size:18px;font-weight:600;display:block;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.wide{margin-top:10px}
.kpi.wide span{display:block;font-size:12px;margin-top:6px}
.donut{position:relative;width:160px;height:160px;margin:4px auto 14px}
.donut svg{transform:rotate(-90deg);display:block}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dc small{color:var(--muted);font-size:11px}
.dc b{font-size:18px}
.lg{display:grid;grid-template-columns:10px 1fr auto 38px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.lg span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-weight:600;font-variant-numeric:tabular-nums}
.lg small{text-align:right;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px}
.bp+.bp{margin-top:14px}
.bp .row{font-size:13px}
.bp .row b{font-weight:600}
.hint{display:flex;gap:10px;align-items:center;margin-top:10px}
.hint span{flex:1;font-size:14px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:150px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bpair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bpair i{width:10px;border-radius:4px 4px 2px 2px;min-height:2px;display:block}
.bi{background:var(--green)} .bo{background:var(--bo)}
.bcol small{font-size:11px;color:var(--muted)}
.bcol.cur small{color:var(--ink);font-weight:700}
.blg{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:var(--t2)}
.blg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* Settings */
.group-t{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 4px 8px}
.group{background:var(--card2);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;width:100%;min-height:50px;border-top:1px solid var(--line);font-size:15px}
.srow:first-child{border-top:0}
.srow>span:first-child{flex:none;max-width:60%}
.srow input{text-align:right;border:0;background:transparent;font-size:16px;outline:none;flex:1;min-width:0;padding:0;color:var(--t5)}
.srow .muted{display:flex;align-items:center;gap:4px;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.stack{flex-direction:column;align-items:stretch;gap:10px}
.srow.stack>span:first-child{max-width:none;font-size:13px;color:var(--muted)}
.srow .lead{display:flex;align-items:center;gap:10px;min-width:0}
.danger{color:var(--red)}
.note{font-size:12px;color:var(--muted);margin:8px 6px 0;line-height:1.45}
.foot{text-align:center;color:var(--foot);font-size:12px;margin:26px 0 0}
.switch{width:51px;height:31px;border-radius:999px;background:var(--seg);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(440px,calc(100% - 28px));background:var(--tabbar);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:40px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 10px 30px rgba(0,0,0,.09),0 0 0 1px rgba(0,0,0,.03);z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:32px;font-size:11px;color:var(--t4);text-align:center;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tab.on{background:var(--tab-on);color:var(--tab-on-ink);font-weight:600}
.tab.on svg{stroke-width:2.2}
.tab.on[data-v=home] svg path{fill:currentColor}

/* Sheet */
#sheets:not(.open){pointer-events:none}
#sheets .backdrop{position:fixed;inset:0;background:var(--dim);opacity:0;transition:opacity .25s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--sheet);border-radius:28px 28px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;overscroll-behavior:contain}
#sheets.open .backdrop{opacity:1}
#sheets.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--grab);margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sh-h h2{margin:0;font-size:20px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:22px 0 12px}
.amt input{width:1.2em;max-width:calc(100% - 60px);text-align:center;border:0;background:transparent;font-size:42px;font-weight:600;letter-spacing:-.02em;outline:none;padding:0;font-variant-numeric:tabular-nums}
.amt.in input{color:var(--green-ink)}
.amt span{font-size:18px;color:var(--muted);flex:none}
.hint-t{text-align:center;font-size:13px;color:var(--t3);margin:0 0 6px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin:14px 0 16px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cats span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;transition:transform .15s,box-shadow .15s;box-shadow:inset 0 0 0 2px transparent}
.cats button.on span{box-shadow:inset 0 0 0 2px var(--ink);transform:scale(1.06)}
.cats small{font-size:11px;color:var(--t4);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cats .addc span{background:transparent;border:1.5px dashed var(--track);font-size:22px;color:var(--muted)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:2px 18px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:6px;background:var(--input);border:1px solid var(--input-line);border-radius:20px;padding:8px 12px;font-size:13.5px;white-space:nowrap}
.pill.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.plabel{font-size:12px;color:var(--muted);margin:0 0 6px 4px;display:block}
.field{display:block;margin-bottom:10px}
.field>small{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 4px}
.field input,.inrow{display:block;width:100%;background:var(--input);border:1px solid var(--input-line);border-radius:13px;padding:12px 14px;font-size:16px;outline:none;min-height:48px;-webkit-appearance:none;appearance:none;color:var(--ink)}
.field input:focus{border-color:var(--input-focus)}
.field input::-webkit-date-and-time-value{text-align:left}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inrow{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px}
.field .inrow input{border:0;padding:8px 0;min-height:0;background:transparent;border-radius:0;flex:1;min-width:0}
.inrow.suf span{color:var(--muted);padding-right:10px}
.btn{display:block;width:100%;background:var(--btn);color:var(--btn-ink);border-radius:16px;padding:16px;text-align:center;font-weight:600;font-size:16px;margin-top:8px;transition:transform .15s}
.btn.sm{width:auto;padding:10px 16px;margin:0;border-radius:11px;font-size:14px;flex:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost.danger{color:var(--red)}
.btn.red{background:var(--red);color:#fff}
.check{display:flex;gap:10px;align-items:center;margin:6px 4px 10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--btn);flex:none}
.dsum{margin-bottom:14px}
.dsum small{font-size:13px;color:var(--muted)}
.dsum b{display:block;font-size:30px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
.dsum b span{font-size:15px;color:var(--muted)}
.dsum .muted{font-size:13px}
.dsum p{margin:10px 0 0;font-size:14px}
.txt{font-size:14px;line-height:1.5;color:var(--t5)}
.txt ol{padding-left:20px;margin:8px 0}
.txt li{margin-bottom:8px}
.warnbox{background:var(--warn-bg);color:var(--nag-ink);font-size:13px;padding:12px 14px;border-radius:14px;margin-bottom:14px;line-height:1.45}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
.swatches button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px transparent;display:grid;place-items:center;font-size:18px}
.swatches button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.emojis button{background:var(--input)}
textarea.out{width:100%;height:180px;border-radius:13px;border:1px solid var(--input-line);background:var(--input);color:var(--ink);padding:12px;font:12px/1.45 ui-monospace,Menlo,monospace;resize:vertical}

/* PIN lock */
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px)}
#lock h2{margin:0;font-size:20px;font-weight:600;text-align:center}
#lock p{margin:-14px 0 0;color:var(--muted);font-size:14px;text-align:center;min-height:19px}
.logo{width:72px;height:72px;border-radius:20px;background:var(--card2);box-shadow:var(--sh);display:grid;place-items:center}
.pdots{display:flex;gap:18px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);transition:background .12s}
.pdots i.f{background:var(--ink)}
.pdots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:16px 24px}
.pad button{width:74px;height:74px;border-radius:50%;background:var(--card2);box-shadow:var(--sh);font-size:28px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--seg)}
.pad button.t{background:transparent;box-shadow:none;font-size:14px;color:var(--muted)}
.forgot{font-size:13px;color:var(--muted);text-decoration:underline}

/* Toast */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-160%);background:var(--toast);color:var(--toast-ink);padding:11px 18px;border-radius:30px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:50;transition:transform .3s cubic-bezier(.2,.8,.2,1);width:max-content;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.show{transform:translate(-50%,0)}
#toast button{color:var(--toast-act);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const fresh = () => ({

/* v1 (asl Hamyon) ma'lumotlarini v2 ga ko'chirish: start → asosiy hisob qoldig'i, har bir amalga hisob */
function migrate(r) {
  const s = {...fresh(), ...r};
  if (!Array.isArray(r.accounts) || !r.accounts.length) s.accounts = [{...fresh().accounts[0], initial: Number(r.start) || 0}];
  delete s.start;
  const first = s.accounts[0].id;
  s.tx = (s.tx || []).map(t => ({...t, acc: t.acc && s.accounts.some(a => a.id === t.acc) ? t.acc : first}));
  s.debts = (s.debts || []).map(d => ({...d, acc: d.acc && s.accounts.some(a => a.id === d.acc) ? d.acc : first, payments: d.payments || []}));
  s.cats = Array.isArray(s.cats) ? s.cats : [];
  s.catLimits = s.catLimits || {};
  if (!L[s.lang]) s.lang = 'uz';
  s.v = 2;
  return s;
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && Array.isArray(r.tx)) return migrate(r);
  } catch (e) {}
  return fresh();
}

/* =================== Til va formatlash =================== */
const LI = () => ({uz:0, ru:1, en:2})[S.lang] ?? 0;
function T(k, p) {
  let s = L[S.lang]?.[k] ?? L.uz[k] ?? k;
  if (p && typeof s === 'string') for (const x in p) s = s.split('{' + x + '}').join(p[x]);
  return s;
}
const MONTHS = () => T('months'), MSHORT = () => T('mshort');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const mkey = s => s.slice(0, 7);
const shiftMonth = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const mlabel = k => { const [y, m] = k.split('-').map(Number); return `${MONTHS()[m - 1]} ${y}`; };
const daysIn = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); };
function dateText(s) {
  const d = parseISO(s), y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() : '';
  if (S.lang === 'ru') return `${d.getDate()} ${L.ru.monthsGen[d.getMonth()]}${y ? ' ' + y : ''}`;
  if (S.lang === 'en') return `${L.en.mshort[d.getMonth()]} ${d.getDate()}${y ? ', ' + y : ''}`;
  return `${d.getDate()}-${L.uz.months[d.getMonth()].toLowerCase()}${y ? ' ' + y : ''}`;
}
function dayLabel(s) {
  if (s === today()) return T('today');
  if (s === dayOffset(-1)) return T('yesterday');
  if (s === dayOffset(1)) return T('tomorrow');
  return dateText(s);
}
function ago(ts) {
  if (!ts) return '';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return T('justNow');
  if (m < 60) return T('minAgo', {n: m});
  const h = Math.floor(m / 60);
  if (h < 24) return T('hourAgo', {n: h});
  return T('dayAgo', {n: Math.floor(h / 24)});
}
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmt = n => grp(String(Math.round(Math.abs(n))));
const fmtUsd = n => '$' + grp(Math.floor(Math.abs(n) + 1e-9).toString()) + '.' + pad(Math.round((Math.abs(n) % 1) * 100) % 100);
const money = (n, sign) => (n < 0 ? '−' : sign ? '+' : '') + fmt(n) + ' ' + T('sum');
const amtCur = (n, cur, sign) => cur === 'USD' ? (n < 0 ? '−' : sign ? '+' : '') + fmtUsd(n) : money(n, sign);
const amtBare = (n, cur) => cur === 'USD' ? fmtUsd(n) : fmt(n);
const digits = s => Number(String(s).replace(/\D/g, '')) || 0;
const parseDec = s => { const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(v) ? Math.round(v * 100) / 100 : 0; };
const parseAmt = (s, cur) => cur === 'USD' ? parseDec(s) : digits(s);
function short(n) {
  const [b, m, k] = T('units'), en = S.lang === 'en';
  const a = Math.abs(n), t = (v, u) => { const r = (Math.round(v * 10) / 10).toString(); return (en ? r : r.replace('.', ',')) + (en ? '' : ' ') + u; };
  if (a >= 1e9) return t(n / 1e9, b);
  if (a >= 1e6) return t(n / 1e6, m);
  if (a >= 1e4) return t(n / 1e3, k);
  return fmt(n);
}
const initials = name => (name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';

/* =================== Ma'lumot modeli =================== */
const allCats = () => [
  ...BASE_CATS.out.map(c => ({...c, type:'out'})), ...BASE_CATS.in.map(c => ({...c, type:'in'})),
  ...S.cats.map(c => ({...c, custom:true})),
];
const catList = type => allCats().filter(c => c.type === type && !c.hidden);
const cat = id => allCats().find(c => c.id === id) || {...BASE_CATS.out.find(c => c.id === 'other'), type:'out'};
const catName = c => c.custom ? c.name : (CAT_NAMES[c.id] || CAT_NAMES.other)[LI()];
const acc = id => S.accounts.find(a => a.id === id) || S.accounts[0];
const accName = a => a ? (a.k === 'main' && !a.name ? T('accMain') : a.name) : '';
const curOf = id => acc(id)?.cur || 'UZS';
const toUZS = (v, cur) => cur === 'USD' ? v * (S.rate || 0) : v;
const uzs = t => toUZS(t.amount, curOf(t.acc));
const hasUsd = () => S.accounts.some(a => a.cur === 'USD');
function accBal(a) {
  let b = Number(a.initial) || 0;
  for (const t of S.tx) {
    if (t.acc === a.id) b += t.type === 'in' ? t.amount : -t.amount;
    if (t.type === 'transfer' && t.to === a.id) b += t.toAmount ?? t.amount;
  }
  return Math.round(b * 100) / 100;
}
const balance = () => S.accounts.reduce((s, a) => s + toUZS(accBal(a), a.cur), 0);
const monthTx = k => S.tx.filter(t => mkey(t.date) === k && t.type !== 'transfer' && !DEBT_CATS.has(t.cat));
const sum = (arr, type) => arr.reduce((a, t) => a + (t.type === type ? uzs(t) : 0), 0);
const sortTx = arr => [...arr].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time) || (b.created || 0) - (a.created || 0));
const debtLeft = d => Math.round((d.amount - d.payments.reduce((a, p) => a + p.amount, 0)) * 100) / 100;
const dueDebts = () => S.debts.filter(d => debtLeft(d) > 0 && d.due && d.due <= dayOffset(3));

function budgetWarn(catId, date) {
  const k = mkey(date), mt = monthTx(k).filter(t => t.type === 'out');
  const l = S.catLimits[catId];
  if (l && sum(mt.filter(t => t.cat === catId), 'out') > l) return T('catLimitOver', {c: catName(cat(catId))});
  if (S.limit && sum(mt, 'out') > S.limit) return T('monthLimitOver');
  return '';
}

  const groups = [];
  for (const t of arr.slice(0, 400)) {
    let g = groups[groups.length - 1];
    if (!g || g.d !== t.date) groups.push(g = {d: t.date, items: [], net: 0});
    g.items.push(t); if (t.type !== 'transfer') g.net += t.type === 'in' ? uzs(t) : -uzs(t);
  }
  return groups.map(g => `<div class="dhead"><span>${dayLabel(g.d)}</span><span class="${g.net < 0 ? 'neg' : 'pos'}">${money(g.net, true)}</span></div>
    <div class="list">${g.items.map(txRow).join('')}</div>`).join('');
}

function vStats() {
  const k = statsMonth, mt = monthTx(k), out = sum(mt, 'out'), inc = sum(mt, 'in');
  const byCat = {};
  mt.filter(t => t.type === 'out').forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + uzs(t));
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const isCur = k === mkey(today());
  const days = isCur ? new Date().getDate() : daysIn(k);
  const prevOut = sum(monthTx(shiftMonth(k, -1)), 'out');
  const delta = prevOut ? Math.round((out - prevOut) / prevOut * 100) : null;
  const sr = inc ? Math.round((inc - out) / inc * 100) : null;
  return `
  <header class="ph"><h1>${T('stats')}</h1></header>
  <div class="mswitch">
    <button class="round sm" data-act="mshift" data-n="-1" aria-label="${T('prevM')}">${ic('back', 18)}</button>
    <b>${mlabel(k)}</b>
    <button class="round sm" data-act="mshift" data-n="1" aria-label="${T('nextM')}" ${isCur ? 'disabled' : ''}>${ic('chevR', 18)}</button>
  </div>
  <div class="kpis">
    <div class="card kpi"><small>${T('in')}</small><b class="pos">+${fmt(inc)}</b></div>
    <div class="card kpi"><small>${T('out')}</small><b class="neg">−${fmt(out)}</b></div>
  </div>
  <div class="card kpi wide"><small>${T('net')}</small><b class="${inc - out < 0 ? 'neg' : ''}">${money(inc - out, true)}</b>
    <span class="muted">${T('avgDaily', {v: money(out / days)})}</span>
    ${delta !== null ? `<span class="muted">${T('vsPrev', {v: `<b class="${delta > 0 ? 'neg' : 'pos'}" style="display:inline;font-size:12px">${delta > 0 ? '+' : ''}${delta}%</b>`})}</span>` : ''}
    ${sr !== null ? `<span class="muted">${T('saveRate', {v: sr + '%'})}</span>` : ''}</div>

  <div class="sec"><span>${T('structure')}</span></div>
  <div class="card">${rows.length ? donut(rows, out) + rows.map(([id, v]) => {
    const c = cat(id);
    return `<div class="lg"><span class="sw" style="background:${c.c}"></span><span>${c.e} ${esc(catName(c))}</span><b>${fmt(v)}</b><small>${Math.round(v / out * 100)}%</small></div>`;
  }).join('') : empty('📊', T('noExpM'))}</div>
  ${budgetProgress(byCat, out)}

  <div class="sec"><span>${T('last6')}</span></div>
  <div class="card">${bars(k)}</div>
  <p class="foot">${T('statsFoot')}</p>`;
}

function donut(rows, total) {
  const R = 56, C = 2 * Math.PI * R;
  let off = 0;
  const segs = rows.map(([id, v]) => {
    const len = v / total * C, gap = rows.length > 1 ? 2 : 0;
    const s = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${cat(id).c}" stroke-width="20" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
    return s;
  }).join('');
  return `<div class="donut"><svg viewBox="0 0 160 160" width="160" height="160"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--donut-bg)" stroke-width="20"/>${segs}</svg>
    <div class="dc"><small>${T('total')}</small><b>${short(total)}</b></div></div>`;
}

function budgetProgress(byCat, out) {
  const lims = Object.entries(S.catLimits).filter(([id, v]) => v > 0 && allCats().some(c => c.id === id));
  if (!S.limit && !lims.length) return `<button class="card hint" data-act="budget">${ic('target', 20)}<span>${T('setLimitsHint')}</span>${ic('chevR', 18)}</button>`;
  const item = (label, v, l) => {
    const p = v / l;
    return `<div class="bp"><div class="row"><span>${label}</span><span><b>${fmt(v)}</b> / ${fmt(l)}</span></div>
      <div class="bar sm ${p >= 1 ? 'over' : p >= .8 ? 'warn' : ''}"><i style="width:${Math.min(100, p * 100)}%"></i></div></div>`;
  };
  return `<div class="sec"><span>${T('budget')}</span><button class="link" data-act="budget">${T('edit')}</button></div>
  <div class="card">${S.limit ? item(T('overallLimit'), out, S.limit) : ''}${lims.map(([id, l]) => item(cat(id).e + ' ' + esc(catName(cat(id))), byCat[id] || 0, l)).join('')}</div>`;
}

function bars(k) {
  const data = [5, 4, 3, 2, 1, 0].map(i => { const m = shiftMonth(k, -i), t = monthTx(m); return {m, i: sum(t, 'in'), o: sum(t, 'out')}; });
  const max = Math.max(1, ...data.map(d => Math.max(d.i, d.o)));
  return `<div class="bars">${data.map(d => `<button class="bcol ${d.m === k ? 'cur' : ''}" data-act="setMonth" data-m="${d.m}" aria-label="${mlabel(d.m)}">
      <span class="bpair"><i class="bi" style="height:${d.i / max * 100}%"></i><i class="bo" style="height:${d.o / max * 100}%"></i></span>
      <small>${MSHORT()[+d.m.slice(5) - 1]}</small></button>`).join('')}</div>
    <div class="blg"><span><i class="bi"></i>${T('in')}</span><span><i class="bo"></i>${T('out')}</span></div>`;
}

function debtRow(d) {

      ${paid > 0 && left > 0 ? `<span class="bar xs"><i style="width:${paid / d.amount * 100}%"></i></span>` : ''}

}

const VIEWS = {home: vHome, all: vAll, stats: vStats, debts: vDebts, settings: vSettings};
function renderTabs() {

/* =================== Pastki oyna =================== */
const root = $('#sheets');
let closeTimer;
const closeBtn = () => `<button class="round sm" data-act="closeSheet" aria-label="${T('close')}">${ic('x', 18)}</button>`;
function sheet(html, mount) {
  clearTimeout(closeTimer);
  if (!root.querySelector('.sheet')) {
    root.innerHTML = '<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  }
  const el = root.querySelector('.sheet');
  el.innerHTML = '<div class="grab"></div>' + html;
  el.scrollTop = 0;
  mount && mount(el);
}
function closeSheet() {
  root.classList.remove('open');
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  closeTimer = setTimeout(() => { root.innerHTML = ''; }, 300);
}
const sheetOpen = () => !!root.querySelector('.sheet') && root.classList.contains('open');
function sizeAmt(i) { i.style.width = Math.max(1, i.value.length || 1) * 0.56 + 0.2 + 'em'; }
/* Tasdiqlash oynasi (confirm() o'rniga) */
function ask(title, text, btnLabel, fn, back) {
  sheet(`<div class="sh-h"><h2>${title}</h2>${closeBtn()}</div>
    <p class="txt" style="margin:0 0 6px">${text}</p>
    <button class="btn red" id="aOk">${btnLabel}</button>
    <button class="btn ghost" id="aNo">${T('cancel')}</button>`, el => {
    $('#aOk', el).onclick = () => fn();
    $('#aNo', el).onclick = () => back ? back() : closeSheet();
  });
}
const accPills = (id, sel, exclude) => `<div class="pills" id="${id}">${S.accounts.filter(a => a.id !== exclude).map(a =>
  `<button class="pill ${a.id === sel ? 'on' : ''}" data-a="${a.id}">${ACC_E[a.type] || '💵'} ${esc(accName(a))} <span class="muted">${a.cur}</span></button>`).join('')}</div>`;

/* Kirim / chiqim / o'tkazma */
function openTx(type = 'out', pre = {}) {
  const ex = pre.id ? S.tx.find(t => t.id === pre.id) : null;
  if (type === 'transfer' && !ex && S.accounts.length < 2) { toast(T('needTwoAcc')); return openAcc(); }
  const d = {
    id: ex?.id, type: ex?.type || type, amount: ex?.amount || pre.amount || 0, cat: ex?.cat || pre.cat || null,
    acc: ex?.acc || pre.acc || S.accounts[0].id, to: ex?.to || null, toAmount: ex?.toAmount ?? '',
    date: ex?.date || today(), time: ex?.time || nowTime(), note: ex?.note ?? pre.note ?? '', quick: !!pre.quick,
  };
  const draw = () => {
    const cur = curOf(d.acc), isTr = d.type === 'transfer';
    if (isTr && (!d.to || d.to === d.acc)) d.to = (S.accounts.find(a => a.id !== d.acc) || {}).id;
    const toCur = isTr ? curOf(d.to) : cur;
    const cats = isTr ? [] : catList(d.type);
    if (d.cat && !cats.some(c => c.id === d.cat)) d.cat = null;
    const dec = cur === 'USD';
    const amtVal = d.amount ? (dec ? String(d.amount) : fmt(d.amount)) : '';
    const title = d.id ? T('editTx') : isTr ? T('transfer') : d.type === 'in' ? T('addIn') : T('addOut');
    const est = d.amount && S.rate ? (cur === 'USD' ? fmt(d.amount * S.rate) : String(Math.round(d.amount / S.rate * 100) / 100)) : '0';
    sheet(`
      <div class="sh-h"><h2>${title}</h2>${closeBtn()}</div>
      <div class="seg" id="tType"><button data-t="out" class="${d.type === 'out' ? 'on' : ''}">${T('out')}</button><button data-t="in" class="${d.type === 'in' ? 'on' : ''}">${T('in')}</button>${multiAcc() ? `<button data-t="transfer" class="${isTr ? 'on' : ''}">${T('transfer')}</button>` : ''}</div>
      <div class="amt ${d.type}"><input id="tAmt" class="${dec ? 'dec' : 'num'}" inputmode="${dec ? 'decimal' : 'numeric'}" placeholder="0" value="${amtVal}" autocomplete="off" aria-label="${T('amount')}"><span>${dec ? 'USD' : T('sum')}</span></div>
      ${d.quick ? `<p class="hint-t">${T('quickHint')}</p>` : ''}
      ${multiAcc() || isTr ? `<span class="plabel">${isTr ? T('from') : T('account')}</span>${accPills('tAcc', d.acc)}` : ''}
      ${isTr ? `<span class="plabel">${T('to')}</span>${accPills('tTo', d.to, d.acc)}
        ${cur !== toCur ? `<label class="field"><small>${T('receives', {c: toCur})}</small><input id="tToAmt" class="dec" inputmode="decimal" placeholder="${est}" value="${d.toAmount}" autocomplete="off"></label>` : ''}` : ''}
      ${isTr ? '' : `<div class="cats" id="tCats">${cats.map(c => `<button data-c="${c.id}" class="${d.cat === c.id ? 'on' : ''}"><span style="background:${c.c}26">${c.e}</span><small>${esc(catName(c))}</small></button>`).join('')}
        <button class="addc" data-addcat="1"><span>+</span><small>${T('addCat')}</small></button></div>`}
      <div class="frow">
        <label class="field"><small>${T('date')}</small><input type="date" id="tDate" value="${d.date}"></label>
        <label class="field"><small>${T('time')}</small><input type="time" id="tTime" value="${d.time}"></label>
      </div>
      <label class="field"><small>${T('note')}</small><input id="tNote" value="${esc(d.note)}" placeholder="${T('notePh')}" maxlength="80" autocomplete="off"></label>
      <button class="btn" id="tSave">${d.id ? T('save') : T('add')}</button>
      ${d.id ? `<button class="btn ghost danger" id="tDel">${T('del')}</button>` : ''}`, el => {
      const amt = $('#tAmt', el);
      sizeAmt(amt);
      if (!d.amount) setTimeout(() => amt.focus(), 320);
      amt.addEventListener('input', () => {
        d.amount = parseAmt(amt.value, curOf(d.acc)); sizeAmt(amt);
        const ta = $('#tToAmt', el);
        if (ta && S.rate) ta.placeholder = !d.amount ? '0' : curOf(d.acc) === 'USD' ? fmt(d.amount * S.rate) : String(Math.round(d.amount / S.rate * 100) / 100);
      });
      const sync = () => {
        d.date = $('#tDate', el).value || today(); d.time = $('#tTime', el).value || nowTime(); d.note = $('#tNote', el).value.trim();
        const ta = $('#tToAmt', el); if (ta) d.toAmount = ta.value;
      };
      const commit = () => {
        sync();
        if (!d.amount) { toast(T('needAmount')); amt.focus(); return; }
        if (d.type === 'transfer') {
          if (!d.to || d.to === d.acc) { toast(T('needOtherAcc')); return; }
          const fc = curOf(d.acc), tc = curOf(d.to);
          let toAmount = d.amount;
          if (fc !== tc) {
            toAmount = parseDec(d.toAmount);
            if (!toAmount && S.rate) toAmount = fc === 'USD' ? Math.round(d.amount * S.rate) : Math.round(d.amount / S.rate * 100) / 100;
            if (!toAmount) { toast(T('needAmount')); return; }
          }
          const rec = {type: 'transfer', amount: d.amount, acc: d.acc, to: d.to, toAmount, date: d.date, time: d.time, note: d.note};
          if (d.id) { const t = S.tx.find(t => t.id === d.id); delete t.cat; Object.assign(t, rec); }
          else S.tx.push({id: uid(), ...rec, created: Date.now()});
          save(); closeSheet(); render(); toast(T('trSaved'));
          return;
        }
        if (!d.cat) { toast(T('needCat')); return; }
        const rec = {type: d.type, amount: d.amount, cat: d.cat, acc: d.acc, date: d.date, time: d.time, note: d.note};
        if (d.id) { const t = S.tx.find(t => t.id === d.id); delete t.to; delete t.toAmount; Object.assign(t, rec); }
        else S.tx.push({id: uid(), ...rec, created: Date.now()});
        save(); closeSheet(); render();
        const w = d.type === 'out' ? budgetWarn(d.cat, d.date) : '';
        const kind = d.type === 'in' ? T('in') : T('out');
        toast(w || T(d.id ? 'txSaved' : 'txAdded', {k: kind, v: amtCur(d.amount, curOf(d.acc))}));
      };
      $('#tType', el).onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.t === d.type) return; sync(); d.type = b.dataset.t; draw(); };
      const pillsA = $('#tAcc', el);
      if (pillsA) pillsA.onclick = e => { const b = e.target.closest('[data-a]'); if (!b || b.dataset.a === d.acc) return; sync(); const oc = curOf(d.acc); d.acc = b.dataset.a; if (curOf(d.acc) !== oc) d.amount = 0; d.toAmount = ''; draw(); };
      const pillsT = $('#tTo', el);
      if (pillsT) pillsT.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; sync(); d.to = b.dataset.a; d.toAmount = ''; draw(); };
      const cg = $('#tCats', el);
      if (cg) cg.onclick = e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.addcat) { sync(); return openCatNew(d.type, id => { d.cat = id; draw(); }, draw); }
        d.cat = b.dataset.c;
        el.querySelectorAll('#tCats button').forEach(x => x.classList.toggle('on', x === b));
        if (d.quick && d.amount) commit();
      };
      $('#tSave', el).onclick = commit;
      const del = $('#tDel', el);

      $('#aCol', el).onclick = e => { const b = e.target.closest('button'); if (!b) return; a.color = b.dataset.c; el.querySelectorAll('#aCol button').forEach(x => x.classList.toggle('on', x === b)); };
      $('#aSave', el).onclick = () => {
        keep();
        const name = (a.name || '').trim();
        if (!name) { toast(T('needName')); $('#aName', el).focus(); return; }
        const rec = {id: ex?.id || uid(), type: a.type, cur: a.cur, initial: a.initial, color: a.color};
        if (ex && ex.k === 'main' && name === T('accMain') && !ex.name) rec.k = 'main'; else rec.name = name;

      const pa = $('#dAcc', el);
      if (pa) pa.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; const v = vals(); const oc = curOf(d.acc); d.acc = b.dataset.a; if (curOf(d.acc) !== oc) v.amt = ''; draw(v); };

        if (view !== 'debts') go('debts'); else render();

      };

}

function openDebtDetail(id) {
  const d = S.debts.find(x => x.id === id);
  if (!d) return;
  const left = debtLeft(d), gave = d.dir === 'gave', cur = curOf(d.acc), dec = cur === 'USD';
  sheet(`
    <div class="sh-h"><h2>${esc(d.person)}</h2>${closeBtn()}</div>
    <div class="card dsum">
      <small>${left <= 0 ? T('debtClosed') : gave ? T('theyOwe') : T('youOwe')}</small>
      <b class="${left <= 0 ? '' : gave ? 'pos' : 'neg'}">${amtBare(left > 0 ? left : d.amount, cur)} <span>${dec ? 'USD' : T('sum')}</span></b>
      <span class="muted">${gave ? T('given') : T('taken')}: ${amtCur(d.amount, cur)} · ${dayLabel(d.date)}${d.due ? ' · ' + T('dueOn', {d: dayLabel(d.due)}) : ''}${multiAcc() ? ' · ' + esc(accName(acc(d.acc))) : ''}</span>
      ${d.note ? `<p>${esc(d.note)}</p>` : ''}
    </div>
    ${left > 0 ? `
      <label class="field"><small>${T('partial')}</small><span class="inrow"><input id="pAmt" class="${dec ? 'dec' : 'num'}" inputmode="${dec ? 'decimal' : 'numeric'}" placeholder="${amtBare(left, cur)}"><button class="btn sm" id="pAdd">${T('add')}</button></span></label>
      <button class="btn" id="pAll">${T('fullBack')}</button>` : ''}
    ${d.payments.length ? `<div class="sec"><span>${T('payHist')}</span></div><div class="list">${d.payments.map(p =>
      `<div class="tx"><span class="tx-ic">💸</span><span class="tx-main"><span class="tx-t">${amtCur(p.amount, cur)}</span><span class="tx-s">${dayLabel(p.date)}</span></span></div>`).join('')}</div>` : ''}
    <button class="btn ghost danger" id="dDel">${T('delDebt')}</button>`, el => {
    const pay = a => {
      a = Math.min(a, debtLeft(d));
      if (a <= 0) { toast(T('needAmount')); return; }
      d.payments.push({id: uid(), amount: a, date: today()});
      if (d.affect) S.tx.push({id: uid(), type: gave ? 'in' : 'out', cat: gave ? 'debt_in' : 'debt', amount: a, acc: d.acc, date: today(), time: nowTime(),
        note: T(gave ? 'debtBackNote' : 'debtPaidNote', {p: d.person}), debtId: d.id, created: Date.now()});
      save(); render(); openDebtDetail(id);
      toast(debtLeft(d) <= 0 ? T('debtClosedT') : T('payAdded', {v: amtCur(debtLeft(d), cur)}));
    };
    const pAdd = $('#pAdd', el);
    if (pAdd) {
      pAdd.onclick = () => pay(parseAmt($('#pAmt', el).value, cur));
      $('#pAll', el).onclick = () => pay(debtLeft(d));
    }
    $('#dDel', el).onclick = () => ask(T('delDebt'), T('delDebtQ'), T('del'), () => {
      S.debts = S.debts.filter(x => x.id !== id);
      S.tx = S.tx.filter(t => t.debtId !== id);
      save(); closeSheet(); render(); toast(T('debtDeleted'));
    }, () => openDebtDetail(id));
  });
}

async function shareOrDownload(name, text, mime) {
  if (ANDROID) { HamyonAndroid.saveFile(name, mime, text); return 'android'; }
  const blob = new Blob([text], {type: mime});
  try {
    const file = new File([blob], name, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [file]}) && (IOS || /Android/.test(navigator.userAgent))) {
      await navigator.share({files: [file], title: name}); return true;
    }
  } catch (e) { if (e.name === 'AbortError') return false; }
  showText(name, text);
  return 'shown';
}
async function exportJson() {
  const data = {...S, pin: ''};
  const ok = await shareOrDownload(`hamyon-zaxira-${today()}.json`, JSON.stringify(data, null, 1), 'application/json');

  else if (ok) { S.lastBackup = Date.now(); save(); if (ok === true) { render(); toast(T('backupReady')); } }
}
function exportCsv(sep) {
  const q = v => { const s = String(v ?? ''); return /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const num = v => sep === ';' ? String(v).replace('.', ',') : String(v);
  const lines = [T('cols').map(q).join(sep)];
  sortTx(S.tx).forEach(t => {
    const a = acc(t.acc), cur = a.cur;
    if (t.type === 'transfer') {
      lines.push([t.date, t.time, T('transfer'), q(accName(a) + ' → ' + accName(acc(t.to))), '', num(-t.amount), cur, num(-Math.round(uzs(t))), q(t.note || '')].join(sep));
    } else {
      const s = t.type === 'in' ? 1 : -1;
      lines.push([t.date, t.time, t.type === 'in' ? T('in') : T('out'), q(accName(a)), q(catName(cat(t.cat))), num(s * t.amount), cur, num(s * Math.round(uzs(t))), q(t.note || '')].join(sep));
    }
  });
  closeSheet();
  setTimeout(() => shareOrDownload(`hamyon-${today()}.csv`, '﻿' + (sep === ';' ? 'sep=;\n' : '') + lines.join('\n'), 'text/csv'), 320);
}

function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); if (!data || !Array.isArray(data.tx) || !Array.isArray(data.debts)) throw 0; }
    catch (e) { toast(T('notBackup')); return; }
    ask(T('restoreRow'), T('restoreQ', {a: data.tx.length, d: data.debts.length}), T('confirm'), () => {
      const keep = {pin: S.pin};
      S = {...migrate(data), ...keep, onboarded: true}; save(); closeSheet(); rerenderAll(); toast(T('restored'));
    });
  };
  r.readAsText(file);
}

/* =================== PIN =================== */
/* SHA-256 (sof JS — file:// muhitida crypto.subtle bo'lmasligi mumkin) */
function sha256(str) {
  const K = [], H = [];
  let n = 2, c = 0;
  const frac = x => (x - Math.floor(x)) * 4294967296 | 0;
  while (c < 64) { let p = true; for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; } if (p) { if (c < 8) H[c] = frac(Math.pow(n, 1 / 2)); K[c++] = frac(Math.pow(n, 1 / 3)); } n++; }
  const bytes = unescape(encodeURIComponent(str)).split('').map(ch => ch.charCodeAt(0));
  const l = bytes.length * 8; bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
  const r = (x, k) => (x >>> k) | (x << (32 - k)), W = new Array(64);
  for (let o = 0; o < bytes.length; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = (bytes[o + 4 * i] << 24) | (bytes[o + 4 * i + 1] << 16) | (bytes[o + 4 * i + 2] << 8) | bytes[o + 4 * i + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(W[i - 15], 7) ^ r(W[i - 15], 18) ^ (W[i - 15] >>> 3), s1 = r(W[i - 2], 17) ^ r(W[i - 2], 19) ^ (W[i - 2] >>> 10); W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0; }
    let [a, b, cc, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const pinHash = p => sha256('hamyon:' + p);
let locked = false, pendingCmd = null, hiddenAt = 0;
function pinScreen({title, sub, onDone, cancellable, forgot}) {
  const old = $('#lock'); if (old) old.remove();
  const el = document.createElement('div'); el.id = 'lock'; el.setAttribute('role', 'dialog'); el.tabIndex = -1;
  el.innerHTML = `<div class="logo">${LOGO}</div><h2></h2><p></p><div class="pdots">${'<i></i>'.repeat(4)}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="t" data-k="c">${cancellable ? T('cancel') : ''}</button><button data-k="0">0</button><button class="t" data-k="b" aria-label="${T('del')}">⌫</button></div>
    ${forgot ? `<button class="forgot" data-k="f">${T('pinForgot')}</button>` : ''}`;
  let code = '';
  const h = $('h2', el), p = $('p', el), dots = $('.pdots', el);
  h.textContent = title; p.textContent = sub;
  const paint = () => dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('f', i < code.length));
  const close = () => { el.remove(); };
  const press = k => {
    if (k === 'f') { forgot(); return; }
    if (k === 'c') { if (cancellable) close(); return; }
    if (k === 'b') { code = code.slice(0, -1); return paint(); }
    if (code.length >= 4) return;
    code += k; paint();
    if (code.length === 4) setTimeout(() => {
      const r = onDone(code);
      if (r === true) close();
      else { code = ''; paint(); if (r?.title) h.textContent = r.title; p.textContent = r?.sub || sub; dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }
    }, 120);
  };
  el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  el.addEventListener('keydown', e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('b'); });
  el.close = close;
  document.body.appendChild(el); el.focus();
  return el;
}
function lockApp() {
  if (!S.pin || locked) return;
  locked = true;
  pinScreen({title: 'Hamyon', sub: T('pinEnter'), onDone: c => {
    if (pinHash(c) !== S.pin) return {sub: T('pinWrong')};
    locked = false;
    if (pendingCmd) { const q = pendingCmd; pendingCmd = null; setTimeout(() => window.hamyonHandle(q), 50); }
    return true;
  }, forgot: () => {
    const l = $('#lock'); if (l) l.style.display = 'none';
    ask(T('pinForgot'), T('pinForgotQ'), T('pinResetBtn'), () => {
      const lang = S.lang; S = fresh(); S.lang = lang; S.onboarded = true; save();
      locked = false; const l2 = $('#lock'); if (l2) l2.remove(); closeSheet(); view = 'home'; rerenderAll(); toast(T('wiped'));
    }, () => { closeSheet(); const l3 = $('#lock'); if (l3) l3.style.display = ''; });
  }});
}
function setPin(after) {
  let first = null;
  pinScreen({title: T('pinNew'), sub: T('pinThink'), cancellable: true, onDone: c => {
    if (!first) { first = c; return {title: T('pinConfirm'), sub: T('pinRepeat')}; }
    if (c !== first) { first = null; return {title: T('pinNew'), sub: T('pinMismatch')}; }
    S.pin = pinHash(c); save(); render(); toast(after || T('pinOn')); return true;
  }});
}
function checkPin(title, fn) {
  pinScreen({title, sub: T('pinCurrent'), cancellable: true, onDone: c => {
    if (pinHash(c) !== S.pin) return {sub: T('pinWrong')};
    setTimeout(fn, 50); return true;
  }});
}

/* =================== Toast =================== */
let toastTimer;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { action.fn(); t.classList.remove('show'); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2600);
}

  toggleHide: () => { S.hide = !S.hide; save(); render(); },

    const t = S.tx.find(x => x.id === b.dataset.id);

    if (t.debtId && S.debts.some(d => d.id === t.debtId)) openDebtDetail(t.debtId);
    else openTx(t.type, {id: t.id});
  },

  pinToggle: () => S.pin ? checkPin(T('pinOffT'), () => { S.pin = ''; save(); render(); toast(T('pinOff')); }) : setPin(),
  pinChange: () => checkPin(T('changePin'), () => setPin(T('saved'))),
  closeSheet: () => closeSheet(),
  widgetHelp: () => openWidgetHelp(),
  installHelp: () => openInstallHelp(),
  dismissInstall: () => { S.installSeen = true; save(); render(); },
  copyUrl: b => copyUrl(b.dataset.u),
  exportJson: () => exportJson(),
  exportMenu: () => openExportMenu(),
  importJson: () => $('#importFile').click(),
  wipe: () => ask(T('wipeRow'), T('wipeQ'), T('erase'), () => {
    const lang = S.lang, theme = S.theme;
    S = fresh(); S.lang = lang; S.theme = theme; S.onboarded = true; save(); closeSheet(); view = 'home'; rerenderAll(); toast(T('wiped'));
  }),
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) { e.preventDefault(); f(b); }
});
document.addEventListener('input', e => {
  const i = e.target;
  if (i.classList && i.classList.contains('num')) { const v = digits(i.value); i.value = v ? fmt(v) : ''; }
  if (i.classList && i.classList.contains('dec')) {
    let v = i.value.replace(/[^\d.,]/g, '').replace(',', '.');
    const p = v.split('.'); if (p.length > 2) v = p[0] + '.' + p.slice(1).join('');
    const [w, f] = v.split('.'); i.value = f !== undefined ? w + '.' + f.slice(0, 2) : w;
  }
  if (i.id === 'q') { allQuery = i.value; $('#allList').innerHTML = allList(); }
});
document.addEventListener('change', e => {
  const i = e.target;
  if (i.id === 'sName') { S.name = i.value.trim(); save(); }
  if (i.id === 'importFile' && i.files[0]) { importFile(i.files[0]); i.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && root.querySelector('.sheet')) closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  if (S.pin && hiddenAt && Date.now() - hiddenAt > 60000) { closeSheet(); lockApp(); }
  hiddenAt = 0;
  if (root.querySelector('.sheet')) return;
  S = load(); applyTheme(); render();
});
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

/* =================== URL / widget / ikonka menyusi =================== */
/* ?add=out|in|transfer [&amount=50000] [&cat=transport] [&note=Taksi] */
function handleUrl() {
  const p = new URLSearchParams(location.search);
  if (!p.has('add')) return false;
  history.replaceState(null, '', location.pathname);
  if (locked) { pendingCmd = p.toString(); return true; }
  handleParams(p);
  return true;
}
function handleParams(p) {
  const type = p.get('add') === 'in' ? 'in' : 'out';
  const amount = Math.round(parseFloat(String(p.get('amount') || '').replace(/[\s ]/g, '').replace(',', '.')) || 0);
  const cq = (p.get('cat') || '').toLowerCase();
  const c = catList(type).find(x => x.id === cq || catName(x).toLowerCase() === cq || (CAT_NAMES[x.id] || []).some(n => n.toLowerCase() === cq));
  const note = (p.get('note') || '').slice(0, 80);
  const a = S.accounts.find(x => x.cur === 'UZS') || S.accounts[0];
  if (amount > 0 && c) {
    const t = {id: uid(), type, amount, cat: c.id, acc: a.id, date: today(), time: nowTime(), note, created: Date.now()};
    S.tx.push(t); save(); render();
    const w = type === 'out' ? budgetWarn(c.id, t.date) : '';
    toast(w || `✓ ${c.e} ${amtCur(amount, a.cur)}`, {label: T('undo'), fn: () => { S.tx = S.tx.filter(x => x.id !== t.id); save(); render(); }});
  } else {
    if (view !== 'home') go('home');
    openTx(type, {amount, note, cat: c?.id, acc: a.id, quick: amount > 0});
  }
}
window.hamyonHandle = qs => {
  const p = new URLSearchParams(qs);
  if (!p.has('add')) return;
  if (locked) { pendingCmd = qs; return; }
  handleParams(p);
};
window.hamyonBack = () => {
  if ($('#lock') && !locked) { $('#lock').close?.(); return true; }
  if (locked) return false;
  if (sheetOpen()) { closeSheet(); return true; }
  if (view !== 'home') { go('home'); return true; }
  return false;
};

/* =================== Ishga tushirish =================== */

if (!fromUrl && !S.onboarded && !S.tx.length) openWelcome();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
